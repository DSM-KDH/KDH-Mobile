name: kdh_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  go_router: ^14.0.0
  material_symbols_icons: ^4.2.0
  watch_connectivity: ^0.2.4
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.69.0
  audioplayers: ^6.6.0
  dio: ^5.0.0
  webview_flutter: ^4.0.0
  wakelock_plus: ^1.3.4
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_background_service: ^5.0.5
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/font/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/font/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/font/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/font/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/font/Pretendard-Light.ttf
          weight: 300

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false